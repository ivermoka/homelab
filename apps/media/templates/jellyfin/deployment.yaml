apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  labels:
    app.kubernetes.io/name: jellyfin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jellyfin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jellyfin
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.puid }}
        runAsGroup: {{ .Values.pgid }}
        fsGroup: {{ .Values.pgid }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jellyfin
          image: "{{ .Values.jellyfin.image.repository }}:{{ .Values.jellyfin.image.tag }}"
          env:
            - {name: TZ, value: {{ .Values.timezone | quote }}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: web
              containerPort: {{ .Values.jellyfin.port }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /cache
            - name: data
              mountPath: /data/media
              subPath: media
              readOnly: true
          resources:
            {{- toYaml .Values.jellyfin.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /health, port: web}
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health, port: web}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: web}
            periodSeconds: 30
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: cache
          emptyDir:
            sizeLimit: {{ .Values.jellyfin.cacheLimit }}
        - name: data
          persistentVolumeClaim:
            claimName: data
