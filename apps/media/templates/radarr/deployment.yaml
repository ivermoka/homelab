apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  labels:
    app.kubernetes.io/name: radarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: radarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radarr
    spec:
      automountServiceAccountToken: false
      containers:
        - name: radarr
          image: "{{ .Values.radarr.image.repository }}:{{ .Values.radarr.image.tag }}"
          env:
            - {name: PUID, value: {{ .Values.puid | quote }}}
            - {name: PGID, value: {{ .Values.pgid | quote }}}
            - {name: TZ, value: {{ .Values.timezone | quote }}}
          ports:
            - name: web
              containerPort: {{ .Values.radarr.port }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.radarr.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /ping, port: web}
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /ping, port: web}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /ping, port: web}
            periodSeconds: 30
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: radarr-config
        - name: data
          persistentVolumeClaim:
            claimName: data
