apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  labels:
    app.kubernetes.io/name: prowlarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prowlarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prowlarr
    spec:
      automountServiceAccountToken: false
      containers:
        - name: prowlarr
          image: "{{ .Values.prowlarr.image.repository }}:{{ .Values.prowlarr.image.tag }}"
          env:
            - {name: PUID, value: {{ .Values.puid | quote }}}
            - {name: PGID, value: {{ .Values.pgid | quote }}}
            - {name: TZ, value: {{ .Values.timezone | quote }}}
          ports:
            - name: web
              containerPort: {{ .Values.prowlarr.port }}
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            {{- toYaml .Values.prowlarr.resources | nindent 12 }}
          readinessProbe:
            httpGet: {path: /ping, port: web}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /ping, port: web}
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: prowlarr-config
