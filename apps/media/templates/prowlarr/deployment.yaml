apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  labels:
    app.kubernetes.io/name: prowlarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prowlarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prowlarr
    spec:
      automountServiceAccountToken: false
            securityContext:
      sysctls:
        - {name: net.ipv6.conf.all.disable_ipv6, value: "1"}
        - {name: net.ipv6.conf.default.disable_ipv6, value: "1"}
      containers:
        - name: prowlarr
          image: "{{ .Values.prowlarr.image.repository }}:{{ .Values.prowlarr.image.tag }}"
          env:
            - {name: PUID, value: {{ .Values.puid | quote }}}
            - {name: PGID, value: {{ .Values.pgid | quote }}}
            - {name: TZ, value: {{ .Values.timezone | quote }}}
          ports:
            - name: web
              containerPort: {{ .Values.prowlarr.port }}
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            {{- toYaml .Values.prowlarr.resources | nindent 12 }}
          readinessProbe:
            httpGet: {path: /ping, port: web}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /ping, port: web}
            initialDelaySeconds: 60
            periodSeconds: 30
      initContainers:
        # native sidecar: starts first, stays running, prowlarr starts only once the tunnel is healthy
        - name: gluetun
          image: "{{ .Values.gluetun.image.repository }}:{{ .Values.gluetun.image.tag }}"
          restartPolicy: Always
          securityContext:
            capabilities:
              add: [NET_ADMIN]
          env:
            - {name: VPN_SERVICE_PROVIDER, value: mullvad}
            - {name: VPN_TYPE, value: wireguard}
            - {name: SERVER_COUNTRIES, value: {{ .Values.gluetun.serverCountries | quote }}}
            - {name: FIREWALL_INPUT_PORTS, value: {{ .Values.prowlarr.webPort | quote }}}
            - {name: FIREWALL_OUTBOUND_SUBNETS, value: "10.42.0.0/16,10.43.0.0/16"}
            - {name: HTTPPROXY, value: "on"}
            - {name: BLOCK_MALICIOUS, value: "on"}
            - {name: BLOCK_ADS, value: "off"}
            - {name: BLOCK_SURVEILLANCE, value: "off"}
            - {name: TZ, value: {{ .Values.timezone | quote }}}
            - name: WIREGUARD_PRIVATE_KEY
              valueFrom: {secretKeyRef: {name: vpn-prowlarr, key: wireguard-private-key}}
            - name: WIREGUARD_ADDRESSES
              valueFrom: {secretKeyRef: {name: vpn-prowlarr, key: wireguard-addresses}}
          startupProbe:
            exec:
              command: ["/gluetun-entrypoint", "healthcheck"]
            periodSeconds: 5
            failureThreshold: 24
          lifecycle:
            postStart:
              exec:
                command: ["/bin/sh", "-c", "(ip rule del table 51820; ip -6 rule del table 51820) || true"]
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: prowlarr-config
