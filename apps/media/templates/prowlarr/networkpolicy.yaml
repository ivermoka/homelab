apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prowlarr-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prowlarr
  policyTypes: [Egress]
  egress:
    # pods in this namespace: the Gluetun proxy now, Radarr/Sonarr later
    - to:
        - podSelector: {}
    # cluster DNS, needed to resolve the name "qbittorrent"
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
