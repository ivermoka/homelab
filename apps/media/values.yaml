timezone: Europe/Oslo
puid: 1000
pgid: 1000

storage:
  data:
    class: local-path-hdd # the 4 TB HDD (/var/mnt/media); change if another node is added
    size: 3Ti # not enforced by local-path
  configClass: local-path # app config/databases on the SSD

qbittorrent:
  image:
    repository: lscr.io/linuxserver/qbittorrent
    tag: "5.3.0_v2.1.2-ls487"
  webPort: 8080
  host: qbitt.home.lan
  configSize: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

gluetun:
  image:
    repository: ghcr.io/qdm12/gluetun
    tag: "v3.41.3"
  serverCountries: Sweden

prowlarr:
  image:
    repository: lscr.io/linuxserver/prowlarr
    tag: "3.0.2.5780-ls169"
  port: 9696
  host: prowlarr.home.lan
  configSize: 1Gi
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}

flaresolverr:
  image:
    repository: ghcr.io/flaresolverr/flaresolverr
    tag: "v3.5.2"
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}

radarr:
  image:
    repository: lscr.io/linuxserver/radarr
    tag: "7.0.3.10918-ls328"
  port: 7878
  host: radarr.home.lan
  configSize: 2Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}

sonarr:
  image:
    repository: lscr.io/linuxserver/sonarr
    tag: "4.0.20.3014-ls5"
  port: 8989
  host: sonarr.home.lan
  configSize: 2Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}

jellyfin:
  image:
    repository: ghcr.io/jellyfin/jellyfin
    tag: "12.4"
  port: 8096
  host: jellyfin.home.lan
  lanIP: 192.168.0.201
  configSize: 10Gi
  cacheLimit: 20Gi
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "3", memory: 4Gi}
