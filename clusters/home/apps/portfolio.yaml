apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 'portfolio'
  namespace: 'argocd'
spec:
  project: 'default'
  source:
    repoURL: 'https://github.com/ivermoka/homelab'
    targetRevision: main
    path: 'apps/portfolio'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: 'portfolio'
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
