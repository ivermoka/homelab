ipam: { mode: kubernetes }
kubeProxyReplacement: true
k8sServiceHost: localhost       # KubePrism, the node-local API endpoint
k8sServicePort: 7445
securityContext:
  capabilities:
    ciliumAgent: [CHOWN, KILL, NET_ADMIN, NET_RAW, IPC_LOCK, SYS_ADMIN, SYS_RESOURCE, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]
cgroup:
  autoMount: { enabled: false }
  hostRoot: /sys/fs/cgroup
l2announcements: { enabled: true }
operator: { replicas: 1 }
# client rate limits: size per https://docs.cilium.io/en/stable/network/l2-announcements/ (otherwise leader election can flap)
# Hubble off: with it on, Helm generates a CA and TLS private keys into the rendered
# manifest, which would be committed in talos/patches/60-cilium-inline.yaml (public repo).
# Enable later with hubble.tls.auto.method=cronJob or cert-manager, never "helm".
hubble: { enabled: false }
