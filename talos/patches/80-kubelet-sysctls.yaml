# Lets pods set IPv6 sysctls (Gluetun pod disables IPv6: the cluster is IPv4-only,
# but Gluetun would otherwise pick unreachable IPv6 Mullvad endpoints)
apiVersion: v1alpha1
kind: KubeletConfig
config:
  allowedUnsafeSysctls:
    - net.ipv6.conf.all.disable_ipv6
    - net.ipv6.conf.default.disable_ipv6
