apiVersion: v1alpha1
kind: NetworkDefaultActionConfig
ingress: block
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: apid-ingress
portSelector: { ports: [50000], protocol: tcp }
ingress:
  - subnet: 192.168.0.0/24
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: kubernetes-api-ingress
portSelector: { ports: [6443], protocol: tcp }
ingress:
  - subnet: 192.168.0.0/24
